name: Aura
options:
  bundleIdPrefix: com.aura
  deploymentTarget:
    iOS: 17.0
targets:
  Aura:
    type: application
    platform: iOS
    sources: 
      - App
      - Core
      - Features
      - Intents
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "Aura requires location to track office punch in/out attendance."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Aura uses background location to trigger automatic office punch reminders when entering or leaving office geofences."
        NSLocationAlwaysUsageDescription: "Aura requires background location to trigger office attendance punch alerts."
        NSFaceIDUsageDescription: "Aura uses Face ID to protect your personal task management data, attendance records, and productivity analytics."
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  AuraWidgets:
    type: app-extension
    platform: iOS
    sources: 
      - Widgets
      - LiveActivities
      - Intents
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    dependencies:
      - target: Aura
    settings:
      base:
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
