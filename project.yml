name: Aura
options:
  bundleIdPrefix: com.aura
  deploymentTarget:
    iOS: 17.0
targets:
  Aura:
    type: application
    platform: iOS
    sources: 
      - App
      - Core
      - Features
      - Intents
    info:
      properties:
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "Aura requires location to show contextual task suggestions."
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  AuraWidgets:
    type: app-extension
    platform: iOS
    sources: 
      - Widgets
      - LiveActivities
      - Intents
    info:
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    dependencies:
      - target: Aura
    settings:
      base:
        SWIFT_VERSION: 5.9
        GENERATE_INFOPLIST_FILE: YES
