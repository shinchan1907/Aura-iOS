name: iOS Unsigned Build (Sideloading)

on:
  workflow_dispatch: # Manual trigger for generating IPA

jobs:
  build-sideload:
    name: Build Unsigned IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Build App (Unsigned for iOS Device)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Aura.xcodeproj \
            -scheme Aura \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=build | xcpretty

      - name: Package into IPA
        run: |
          mkdir -p Payload
          mv build/Aura.app Payload/
          zip -r Aura-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Unsigned-IPA
          path: Aura-Unsigned.ipa
