name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Aura (Simulator & Unsigned IPA)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Build Simulator (Verification)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Aura.xcodeproj \
            -scheme Aura \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO | xcpretty

      - name: Build Unsigned iPhone Target & Create IPA
        run: |
          set -o pipefail
          xcodebuild build \
            -project Aura.xcodeproj \
            -scheme Aura \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

          mkdir -p build/Payload
          APP_PATH=$(find build -name "Aura.app" -type d | head -n 1)
          echo "Found app at $APP_PATH"
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r Aura-Unsigned.ipa Payload

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Unsigned-IPA
          path: build/Aura-Unsigned.ipa
