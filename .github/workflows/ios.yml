name: iOS Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Aura (Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.2.app || true

      - name: Build App (Unsigned for CI)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Aura.xcodeproj \
            -scheme Aura \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.2' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO | xcpretty

      # In a real pipeline, you would archive the `.app` or run tests here.
      # Because this is a simulator build, we don't output an IPA. 
      # See release.yml for production signing.
